map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 8m;

    # Compress text responses: the app bundle, styles and API JSON. Cross-site
    # requests carry no credentials (SameSite=Strict cookie, in-memory token),
    # so compressing API responses doesn't open a BREACH-style leak.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /graphql {
        proxy_pass http://gateway:8095;
        proxy_set_header Host $host;
        # Keep the client address Caddy put first; the gateway rate-limits by it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade for live messages.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location /files/ {
        proxy_pass http://gateway:8095;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx's type list lacks .mjs; browsers refuse to run module
        # scripts (the PDF viewer's worker) served as octet-stream.
        location ~ \.mjs$ {
            types { }
            default_type application/javascript;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
